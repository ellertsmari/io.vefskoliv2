<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-labelledby="t d">
  <title id="t">The journey of data in a Next.js app</title>
  <desc id="d">A browser sends a request to the Next.js server, which queries a Postgres database and sends HTML back. Three rendering strategies are shown: static rendering happens at build time, server rendering happens per request, and client rendering happens in the browser after the page loads.</desc>
  <style>
    .card { fill: #ffffff; stroke: #14202e; stroke-width: 2.5; }
    .lbl  { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14202e; }
    .sub  { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4a5b6e; }
    .flow { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14202e; }
    .head { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14202e; }
    .arrow { stroke: #14202e; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .back  { stroke: #0ea5b7; stroke-width: 2.5; fill: none; marker-end: url(#b); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14202e"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0ea5b7"/>
    </marker>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="427" rx="14" fill="#f7f9fb" stroke="#d7dfe7" stroke-width="3"/>

  <!-- boxes -->
  <rect class="card" x="42"  y="120" width="196" height="104" rx="12"/>
  <text class="lbl" x="140" y="163" text-anchor="middle">Browser</text>
  <text class="sub" x="140" y="187" text-anchor="middle">the client</text>

  <rect class="card" x="362" y="120" width="196" height="104" rx="12"/>
  <text class="lbl" x="460" y="163" text-anchor="middle">Next.js server</text>
  <text class="sub" x="460" y="187" text-anchor="middle">your app code</text>

  <rect class="card" x="682" y="120" width="196" height="104" rx="12"/>
  <text class="lbl" x="780" y="163" text-anchor="middle">Postgres</text>
  <text class="sub" x="780" y="187" text-anchor="middle">the database</text>

  <!-- flows -->
  <path class="arrow" d="M244 152 L356 152"/>
  <text class="flow" x="300" y="141" text-anchor="middle">request</text>
  <path class="back"  d="M356 196 L244 196"/>
  <text class="flow" x="300" y="217" text-anchor="middle">HTML</text>

  <path class="arrow" d="M564 152 L676 152"/>
  <text class="flow" x="620" y="141" text-anchor="middle">query</text>
  <path class="back"  d="M676 196 L564 196"/>
  <text class="flow" x="620" y="217" text-anchor="middle">rows</text>

  <!-- where rendering happens -->
  <text class="head" x="460" y="288" text-anchor="middle">Where does the HTML get built?</text>

  <rect class="card" x="42"  y="308" width="260" height="86" rx="12"/>
  <text class="lbl" x="62" y="336">Static rendering</text>
  <text class="sub" x="62" y="360">Built once, ahead of time.</text>
  <text class="sub" x="62" y="378">Fastest. Same for everyone.</text>

  <rect class="card" x="330" y="308" width="260" height="86" rx="12"/>
  <text class="lbl" x="350" y="336">Server rendering</text>
  <text class="sub" x="350" y="360">Built per request, on the server.</text>
  <text class="sub" x="350" y="378">Fresh data. Can be personalised.</text>

  <rect class="card" x="618" y="308" width="260" height="86" rx="12"/>
  <text class="lbl" x="638" y="336">Client rendering</text>
  <text class="sub" x="638" y="360">Built in the browser, after load.</text>
  <text class="sub" x="638" y="378">Interactive. Needs JavaScript.</text>
</svg>
